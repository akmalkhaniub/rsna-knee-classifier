[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsnaknee"
version = "1.0.0"
description = "RSNA knee abnormality detection — preprocessing, multi-view classifier, submission"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dicom = ["pydicom>=2.4"]
torch = ["torch>=2.2", "torchvision>=0.17"]

[tool.setuptools]
packages = ["rsnaknee"]
